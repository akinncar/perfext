name: Release extension

# Publishes the extension to the Chrome Web Store on every merge to the default
# branch that touches the extension, auto-bumping the version through master:
#
#   - If the merge did NOT bump apps/extension/package.json itself, CI bumps the
#     patch version, commits it back to the branch ([skip ci], GITHUB_TOKEN — so
#     the auto-commit never re-triggers workflows), then publishes.
#   - If the merge DID bump the version (detected via the missing
#     `extension-v<version>` git tag), CI respects that version as-is — bump
#     minor/major yourself in the PR when a release deserves it.
#   - Put `[skip release]` in the merge commit message to skip publishing (and
#     bumping) entirely.
#
# The bump commit is pushed BEFORE publishing: if publishing then fails, the
# bumped version has no release tag yet, so the next extension merge retries
# that same version instead of bumping past it.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
# See docs/RELEASING.md for how to obtain them.

on:
  push:
    branches: [main, master]
    # Only extension changes are releases; docs/landing-page merges don't bump.
    paths:
      - "apps/extension/**"
      - ".github/workflows/release-extension.yml"

# Allow the workflow to push the bump commit and the release tag.
permissions:
  contents: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # [skip ci] guards against loops if the auto-commit somehow re-triggers;
    # [skip release] is the manual escape hatch for extension changes you don't
    # want to ship yet.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell a manual bump from a normal merge

      - name: Check publishing credentials
        id: creds
        # Until the secrets are added (see docs/RELEASING.md), the workflow runs
        # but never bumps or publishes — so any merge before setup is a safe no-op.
        env:
          HAS_CREDENTIALS: ${{ secrets.CHROME_EXTENSION_ID != '' && secrets.CHROME_REFRESH_TOKEN != '' }}
        run: |
          echo "configured=${HAS_CREDENTIALS}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_CREDENTIALS}" != "true" ]; then
            echo "::notice::Chrome Web Store secrets are not configured yet — skipping bump and publish. See docs/RELEASING.md."
          fi

      - name: Resolve release version (auto-bump if not bumped manually)
        id: ver
        if: steps.creds.outputs.configured == 'true'
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          if git rev-parse "refs/tags/extension-v$VERSION" >/dev/null 2>&1; then
            # Current version is already released → this merge didn't bump it.
            # Auto-bump the patch version and push it back through the branch.
            cd apps/extension
            NEW_VERSION=$(npm version patch --no-git-tag-version)
            NEW_VERSION=${NEW_VERSION#v}
            cd ../..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/extension/package.json
            git commit -m "chore(release): bump extension to v$NEW_VERSION [skip ci]"
            # Another workflow (package-download) may have pushed to the branch
            # meanwhile; rebase our bump commit on top before pushing.
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
            VERSION=$NEW_VERSION
            echo "::notice::Auto-bumped extension to v$VERSION."
          else
            echo "::notice::Version $VERSION was bumped manually in this merge — releasing it as-is."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=extension-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.creds.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build & zip extension
        if: steps.creds.outputs.configured == 'true'
        run: pnpm --filter @perfext/extension zip

      - name: Submit to Chrome Web Store
        if: steps.creds.outputs.configured == 'true'
        working-directory: apps/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ZIP=$(ls .output/*-chrome.zip | head -n1)
          echo "Submitting $ZIP"
          # Call publish-browser-extension directly (it reads the CHROME_* env
          # vars above). Pinned for reproducible CI.
          pnpm dlx publish-browser-extension@4 --chrome-zip "$ZIP"

      - name: Tag the released version
        if: steps.creds.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
